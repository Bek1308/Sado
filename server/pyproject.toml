[project]
name = "sado"
version = "0.1.0"
description = "Sado backend: speech, agent and memory services."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "num2words>=0.5.14",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
speech = [
    "omnivoice>=0.2.1",
    "torch>=2.11",
    "torchaudio>=2.11.0",
    "transformers>=5.21.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sado"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "N",        # naming
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "ERA",      # commented-out code
    "PL",       # pylint
    "ANN",      # type annotations
]
# Sado works with Cyrillic text and Uzbek apostrophes by design; they are not typos.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["sado"]

[[tool.mypy.overrides]]
module = ["num2words", "omnivoice", "torch", "transformers"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = [
    # Starlette's TestClient nudges towards an `httpx2` package we have not vetted yet.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

# PyPI only ships CPU builds of torch for Windows; RTX 50-series GPUs need CUDA 12.8 wheels.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
