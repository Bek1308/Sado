include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # This is an app, not a published package.
    public_member_api_docs: false
    # Domain ports are interfaces by design, even when they start with one method.
    one_member_abstracts: false
